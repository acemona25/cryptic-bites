<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riddles</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: light-dark(#f6f3ed, #171613);
    --surface: light-dark(#fffdf8, #211f1b);
    --surface-2: light-dark(#f0ece3, #2b2823);
    --text: light-dark(#26231f, #f5f0e7);
    --muted: light-dark(#706b63, #aaa39a);
    --border: light-dark(#ddd7cc, #413c35);
    --accent: light-dark(#6b4eff, #9b88ff);
    --accent-text: #ffffff;
    --success: light-dark(#176b43, #62c995);
    --error: light-dark(#a63b32, #ff8d82);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  #app {
    min-height: 100vh;
    background-color: var(--bg);
    display: grid;
    place-items: center;
    padding: 28px 18px;
    border-radius: 0;
  }
  main { width: min(680px, 100%); }
  .eyebrow {
    text-align: center;
    text-transform: uppercase;
    letter-spacing: .16em;
    font-size: 12px;
    font-weight: 750;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: clamp(28px, 6vw, 52px);
    box-shadow: 0 18px 55px color-mix(in srgb, var(--text) 8%, transparent);
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(38px, 8vw, 64px);
    line-height: .98;
    letter-spacing: -.045em;
    text-align: center;
    margin: 0 0 14px;
  }
  .intro {
    text-align: center;
    color: var(--muted);
    line-height: 1.6;
    max-width: 540px;
    margin: 0 auto 30px;
  }
  .riddle-list { display: grid; gap: 10px; }
  .riddle-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    width: 100%;
    min-height: 58px;
    padding: 15px 18px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--surface-2);
    color: var(--text);
    text-align: left;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .riddle-link:hover { border-color: var(--accent); }
  .riddle-link span:last-child { color: var(--muted); font-size: 20px; }
  .riddle {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(22px, 4vw, 31px);
    line-height: 1.45;
    text-align: center;
    margin: 0 auto 34px;
    max-width: 570px;
    white-space: pre-line;
  }
  .back {
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 0;
    min-height: auto;
    margin-bottom: 24px;
    font-weight: 650;
  }
  .back:hover { filter: none; color: var(--text); }
  .hidden { display: none !important; }
  .form { display: flex; gap: 10px; }
  input {
    min-width: 0;
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: var(--surface-2);
    color: var(--text);
    padding: 15px 16px;
    font-size: 16px;
    outline: none;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  button {
    border: 0;
    border-radius: 13px;
    padding: 0 21px;
    min-height: 52px;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 15px;
    font-weight: 750;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.06); }
  button:active { transform: translateY(1px); }
  .message {
    min-height: 28px;
    text-align: center;
    margin: 20px 0 0;
    font-weight: 700;
  }
  .message.success { color: var(--success); }
  .message.error { color: var(--error); }
  .answer {
    margin-top: 18px;
    padding: 18px;
    border-radius: 14px;
    background: var(--surface-2);
    text-align: center;
    display: none;
  }
  .answer strong { display: block; margin-top: 4px; font-size: 20px; }
  .footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 18px; }
  @media (max-width: 480px) {
    .form { flex-direction: column; }
    button { width: 100%; }
  }
</style>
</head>
<body>
<div id="app">
  <main>
    <div class="eyebrow">Meant to stump</div>
    <section class="card" aria-live="polite">
      <div id="homeView">
        <h1>Cryptic Bites</h1>
        <!-- EDIT THIS DESCRIPTION to explain how your riddles work. -->
        <p class="intro">A collection of unique cryptic crossword clues, meant to be challenging and fun. For hints, questions, or anything else, reach me at acemona25@gmail.com.</p>
        <div class="riddle-list" id="riddleList"></div>
      </div>
      <div id="riddleView" class="hidden">
        <button class="back" id="backButton" type="button">← All riddles</button>
        <h1 id="riddleTitle"></h1>
        <p class="riddle" id="riddle"></p>
        <form class="form" id="answerForm">
          <input id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Your answer..." aria-label="Your answer">
          <button type="submit">Check</button>
        </form>
        <div class="message" id="message"></div>
        <div class="answer" id="answerReveal">The answer was:<strong id="correctAnswer"></strong></div>
      </div>
    </section>
    <div class="footer">Choose a riddle above to begin.</div>
  </main>
</div>
<script>
  // EDIT THIS LIST to add, remove, or change riddles.
  // Each riddle has a question and an array of accepted answers.
  const riddles = [
    { question: "Analyst with joke -- it'd cause a riot (6)", answers: ["pundit"] },
    { question: "Reserve defaced room inside Burger King, no motels left (4)", answers: ["book"] },
    { question: "So Vincent finishes after Rob & AI? (5)", answers: ["robot"] },
    { question: "Quick coffee switches on, helps vision (4)", answers: ["cone"] },
    { question: "Irrational one starts professing insecurities (2)", answers: ["pi"] },
    { question: "Start wash, rinse clothes of remaining organic filth, then toss in driers (5)", answers: ["towel"] },
    { question: "Eel slithers back into sand banks, finally looks to be turning around to rest (5)", answers: ["sleep"] },
    { question: "Sent back Amazon Prime parcel, no place to wander (4)", answers: ["roam"] }
    { question: "No assault rifle? Back up, prepare hurriedly for barrage (6)", answers: ["pepper"] }
    { question: "Five-a-side starts new tipoff alongside Grizzlies in mixed open (8)", answers: ["pentagon"] }
    { question: "Appear to take chair & mirror out of house? (3)", answers: ["use"] }
    { question: "Perfect aisle ten is decayed? (1,3)", answers: ["a ten"] }
    { question: "Egg + egg = waffle (4)", answers: ["eggo"] }
    { question: "Astronauts lost their way, pick up first green ship passengers (9)", answers: ["argonauts"] }
    { question: "Crappy planet messed up half of Aurora with sun returning (6)", answers: ["uranus"] }
    { question: "Sights, sounds, places (5)", answers: ["sites"] }
    { question: "Frazzled chap takes last lassie as passenger princess (5)", answers: ["peach"] }
    { question: "Starting in October, I split rent to stabilize (6)", answers: ["orient"] }
    { question: "Rival, backwards men start eating half-sister (7)", answers: ["nemesis"] }
    { question: "Decorative stone contains crushed ant (6)", answers: ["ornate"] }
    { question: "Go all in! The fast lane runs cuts southeast! (5)", answers: ["shove"] }
    { question: "By area, eventually we cover, even in a pinch (3,6,4)", answers: ["per square inch"] }
    { question: "Win or loss? Firstly, down to earth (5)", answers: ["world"] }
    { question: "'True for false -- typo mixup has first freshman training (5)", answers: ["potty"] }
    { question: "Small dad joke? End of day (4)", answers: ["puny"] }
    { question: "'Sword lost its hilt! After, agape fencer finally returns to say again (6)", answers: ["reword"] }
    { question: "Quiet, confused remark has stop-start (4)", answers: ["hush"] }
    { question: "Small lightbulb paved the way (3)", answers: ["led"] }
    { question: "Wait -- start in Perth, Australia...then east? (5)", answers: ["pause"] }
    { question: "Catch core classes end, for nothing (5)", answers: ["lasso"] }
    { question: "Within document's spicy content (5)", answers: ["cumen"] }
    { question: "Tomcat takes test to start performing best (3)", answers: ["top"] }
    { question: "'Woah! Mom looks to be flipping out!' (3)", answers: ["wow"] }
    { question: "Area 51 retired in the government (5)", answers: ["field"] }
    { question: "Link has broken artificial intelligence to the brim? (3,3)", answers: ["hat tip"] }
    { question: "Cut open fence ends. After, escape hurriedly (5)", answers: ["scene"] }
    { question: "Era. (6)", answers: ["period"] }
    { question: "having a milLION Self-praises!? (8)", answers: ["prideful"] }
    { question: "Pull together naughty gift without heartfelt essence (8)", answers: ["coalesce"] }
    { question: "Cafe oddly switched direction (4)", answers: ["face"] }
    { question: "Lane switch without compass, no one secure (5)", answers: ["latch"] }
    { question: "Get off on smut? I'd mess with it (8)", answers: ["dismount"] }
    { question: "Cover by hip hop artist's sound (7)", answers: ["wrapper"] }
    { question: "Lead kayak's offshore, OK (n)", answers: ["kosher"] }
    { question: "A windshield broken? No time to crow (4)", answers: ["dawn"] }
    { question: "Stud appears in roster -- he's cocky (n)", answers: ["rooster"] }
    { question: "Part of staking domain! (7)", answers: ["kingdom"] }
    { question: "Podiatrist's concern with part of foot shaped like a lemon (8)", answers: ["football"] }
    { question: "Tracking device that both goes out and comes back!? (5)", answers: ["radar"] }
    { question: "Building to turn around apparent loss? (4-2)", answers: ["lean-to"] }
    { question: "Aluminum from Australia lost to another country (7)", answers: ["austria"] }
    { question: "Central intel comes after plan for spy (5)", answers: ["plant"] }
    { question: "Cut across the world (3)", answers: ["hew"] }
    { question: "Accuse ME after dogs bark back?! (5)", answers: ["frame"] }
    { question: "Cup support to cover around half of breast without apparent cleavage( 7)", answers: ["coaster"] }
    { question: "Poker face: start or end blackjack (4)", answers: ["fork"] }
    { question: "Cuddle soon, covers first please (5)", answers: ["spoon"] }
    { question: "Isolated sleep to back final nightmare (6)", answers: ["remote"] }
    { question: "Where experts say flawed plan covers, start enrolling (5)", answers: ["panel"] }
  ];

  const homeView = document.getElementById("homeView");
  const riddleView = document.getElementById("riddleView");
  const riddleList = document.getElementById("riddleList");
  const riddleTitle = document.getElementById("riddleTitle");
  const form = document.getElementById("answerForm");
  const input = document.getElementById("answer");
  const message = document.getElementById("message");
  const reveal = document.getElementById("answerReveal");
  const correctAnswer = document.getElementById("correctAnswer");
  let selectedRiddle = null;

  riddles.forEach((riddle, index) => {
    const button = document.createElement("button");
    button.className = "riddle-link";
    button.type = "button";
    button.innerHTML = "<span>Daily Clue #" + (index + 1) + "</span><span>→</span>";
    button.addEventListener("click", () => openRiddle(index));
    riddleList.appendChild(button);
  });

  function openRiddle(index) {
    selectedRiddle = riddles[index];
    homeView.classList.add("hidden");
    riddleView.classList.remove("hidden");
    riddleTitle.textContent = "Daily Clue #" + (index + 1);
    document.getElementById("riddle").textContent = selectedRiddle.question;
    input.value = "";
    input.disabled = false;
    form.querySelector("button").disabled = false;
    message.textContent = "";
    message.className = "message";
    reveal.style.display = "none";
    input.focus();
  }

  document.getElementById("backButton").addEventListener("click", () => {
    riddleView.classList.add("hidden");
    homeView.classList.remove("hidden");
  });

  function normalize(value) {
    return value.toLowerCase().trim().replace(/[^a-z0-9]/g, "");
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const guess = normalize(input.value);
    if (!guess) return;

    const correct = selectedRiddle.answers.some(answer => normalize(answer) === guess);
    if (correct) {
      message.textContent = "🎉 Correct! Nice work.";
      message.className = "message success";
      correctAnswer.textContent = selectedRiddle.answers[0];
      reveal.style.display = "block";
      input.disabled = true;
      form.querySelector("button").disabled = true;
    } else {
      message.textContent = "Not quite! Keep at it...";
      message.className = "message error";
      input.select();
    }
  });
</script>
</body>
</html>
